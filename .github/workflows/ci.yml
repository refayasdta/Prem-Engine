name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prem_engine
          POSTGRES_USER: prem_engine
          POSTGRES_PASSWORD: prem_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prem_engine -d prem_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://prem_engine:prem_engine@127.0.0.1:5432/prem_engine
      TEST_DATABASE_URL: postgresql+asyncpg://prem_engine:prem_engine@127.0.0.1:5432/prem_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: alembic upgrade head
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - name: Verify production model artifacts are packaged
        run: |
          test -f artifacts/models/goals/goals-v1-156511483a94/model.joblib
          test -f artifacts/models/match-statistics/detailed-statistics-v1-42e73adec486/model.joblib

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
