name: Production acceptance

on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: "Deployed staging frontend origin, without a trailing slash"
        required: true
        type: string
      api_url:
        description: "Deployed staging Cloud Run API origin, without a trailing slash"
        required: true
        type: string
      forecast_service_url:
        description: "Deployed staging private forecast service origin, without a trailing slash"
        required: true
        type: string
      snapshot_url:
        description: "Deployed public snapshot HTTPS origin, without a trailing slash"
        required: true
        type: string
      snapshot_logical_key:
        description: "Snapshot to verify; use forecast/<uuid> for the finalizer acceptance"
        required: true
        default: "standings/default"
        type: string
      expected_snapshot_lifecycle:
        description: "Optional forecast lifecycle, normally complete after T-24+60"
        required: false
        default: ""
        type: string
      acceptance_path:
        description: "Frontend route to audit, such as /matches/<uuid>"
        required: true
        default: "/"
        type: string

permissions:
  contents: read

jobs:
  endpoints-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public health, database readiness, and origin boundary
        env:
          FRONTEND_URL: ${{ inputs.frontend_url }}
          API_URL: ${{ inputs.api_url }}
          FORECAST_SERVICE_URL: ${{ inputs.forecast_service_url }}
          ACCEPTANCE_PATH: ${{ inputs.acceptance_path }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${API_URL}/health")" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${API_URL}/ready")" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${API_URL}/api/forecasts/not-a-uuid")" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${FORECAST_SERVICE_URL}/tasks/forecast")" = "403"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${FORECAST_SERVICE_URL}/tasks/snapshot")" = "403"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${FORECAST_SERVICE_URL}/tasks/monitor")" = "403"
          curl --fail --silent --show-error --dump-header frontend-headers.txt --output /dev/null "${FRONTEND_URL}${ACCEPTANCE_PATH}"
          tr '[:upper:]' '[:lower:]' < frontend-headers.txt > frontend-headers-lower.txt
          grep --quiet '^content-security-policy:' frontend-headers-lower.txt
          grep --quiet '^x-content-type-options: nosniff' frontend-headers-lower.txt
          grep --quiet '^referrer-policy:' frontend-headers-lower.txt
          grep --quiet '^permissions-policy:' frontend-headers-lower.txt
      - name: Verify public snapshot manifest, object, and freshness
        env:
          SNAPSHOT_URL: ${{ inputs.snapshot_url }}
          SNAPSHOT_LOGICAL_KEY: ${{ inputs.snapshot_logical_key }}
          EXPECTED_SNAPSHOT_LIFECYCLE: ${{ inputs.expected_snapshot_lifecycle }}
        shell: bash
        run: |
          set -euo pipefail
          arguments=(
            --base-url "${SNAPSHOT_URL}"
            --logical-key "${SNAPSHOT_LOGICAL_KEY}"
            --require-fresh
          )
          if [[ -n "${EXPECTED_SNAPSHOT_LIFECYCLE}" ]]; then
            arguments+=(--expected-lifecycle "${EXPECTED_SNAPSHOT_LIFECYCLE}")
          fi
          python scripts/deployment/verify_public_snapshot.py "${arguments[@]}"

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Run three accessibility, best-practice, SEO, and performance audits
        working-directory: frontend
        env:
          ACCEPTANCE_URL: ${{ inputs.frontend_url }}${{ inputs.acceptance_path }}
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-acceptance-report
          path: frontend/.lighthouseci
          if-no-files-found: error
          retention-days: 30
