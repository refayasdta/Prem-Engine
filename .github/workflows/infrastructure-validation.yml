name: Infrastructure validation

on:
  pull_request:
    paths:
      - "infra/gcp/terraform/**"
      - "scripts/deployment/**"
      - ".github/workflows/infrastructure-validation.yml"
  push:
    branches: [main]
    paths:
      - "infra/gcp/terraform/**"
      - "scripts/deployment/**"
      - ".github/workflows/infrastructure-validation.yml"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/gcp/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse deployment scripts without executing them
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -LiteralPath scripts/deployment -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
