[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "prem-engine"
version = "0.1.0"
description = "Premier League forecasting, evaluation, and simulation platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "google-cloud-tasks>=2.23,<3",
  "httpx>=0.28,<1",
  "joblib>=1.5,<2",
  "numpy>=2.2,<3",
  "pandas>=2.3,<3",
  "pydantic-settings>=2.10,<3",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "statsmodels>=0.14,<1",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pip-tools>=7.5,<8",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["backend", "modeling"]
include = ["prem_engine_api*", "prem_engine_modeling*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=prem_engine_api --cov=prem_engine_modeling --cov-report=term-missing"
pythonpath = ["backend", "modeling"]
testpaths = ["backend/tests", "modeling/tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["prem_engine_api", "prem_engine_modeling"]
mypy_path = ["backend", "modeling"]
plugins = ["pydantic.mypy"]
